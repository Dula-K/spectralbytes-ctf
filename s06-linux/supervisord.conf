[supervisord]
nodaemon=true
user=root

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
priority=1

[program:collector_loop]
; runs collector.py as root every ~20s — a shell loop is easier to manage
; under supervisor than wiring up cron inside the container
command=/bin/bash -c "while true; do python3 /opt/spectral/collector.py >> /var/log/spectral_collector.log 2>&1; sleep 20; done"
autostart=true
autorestart=true
user=root
priority=10
stdout_logfile=/var/log/collector_loop.out.log
stderr_logfile=/var/log/collector_loop.err.log
